[package]
name = "kvs"
version = "0.1.0"
description = "A key-value store (bitcask)"
edition = "2024"
default-run = "kvs"

[[bin]]
name = "kvs"
path = "src/bin/kvs.rs"

[[bin]]
name = "kvs-server"
path = "src/bin/kvs-server.rs"

[[bin]]
name = "kvs-client"
path = "src/bin/kvs-client.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crc32fast = "1.3.2"
thiserror = "2"
serde_json = "1.0.39"
rustyline = "18.0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4.34"
arc-swap = "1.9.2"

[dev-dependencies]
tempfile = "3.0.7"
walkdir = "2.2.7"
test-log = { version = "0.2", features = ["trace"] }
criterion = "0.8.2"

[[bench]]
name = "bitcask"
harness = false
