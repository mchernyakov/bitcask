[package]
name = "kvs"
version = "0.1.0"
description = "A key-value store"
edition = "2024"

[dependencies]
crc32fast = "1.3.2"
thiserror = "2"
serde_json = "1.0.39"
rustyline = "18.0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.0.7"
walkdir = "2.2.7"
